[project]
name = "rewardhack-interp"
version = "0.1.0"
description = "Research-grade mechanistic interpretability workflows for reward hacking studies on rewardhack-gym."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Yadnyesh Chakane" },
]
keywords = [
  "reward-hacking",
  "mechanistic-interpretability",
  "rewardhack-gym",
  "qwen",
  "transformers",
  "trl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "accelerate>=1.4.0",
  "datasets>=3.2.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "peft>=0.14.0",
  "pyarrow>=19.0.0",
  "pydantic>=2.10.0",
  "scikit-learn>=1.6.0",
  "scipy>=1.14.0",
  "torch>=2.5.0",
  "tqdm>=4.66.0",
  "transformers>=4.51.0",
  "trl>=0.19.1",
  "typer>=0.16.0",
  "wandb>=0.19.0",
  "rewardhack-gym @ git+https://github.com/ydnyshhh/rewardhack-gym.git",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
rewardhack-interp = "rewardhack_interp.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewardhack_interp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest_tmp", "-p", "no:cacheprovider"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.uv]
default-groups = ["dev"]
